services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    # dev-only credentials; bound to this machine only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off release step: checks the env, migrates and seeds under a database lock, then exits.
  release:
    build: .
    image: pharma-docs-rag
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/rag
    command: ["node", "--import", "tsx", "scripts/release.ts"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: pharma-docs-rag
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/rag
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
